name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The plugin is only useful if it actually bundles, and the bundle is what
      # Figma loads, a passing test suite over an unbuildable tree proves nothing.
      - name: Build
        run: npm run build

      - name: Check bundle exists
        run: test -f dist/main.js && test -f dist/ui.html
