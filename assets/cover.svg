<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Quire, sections to PDF">
  <title>Quire, sections to PDF</title>
  <!--
    Figma Community thumbnail, 1920x1080.

    The thumbnail is a press sheet. Crop marks sit at the trim, an ink colour bar runs
    along the bottom edge, and the page sequence is shown as an imposition: sheets
    gathered in order and bound at the spine.

    Two deliberate choices worth keeping.

    Paper, not a dark gradient. Every plugin thumbnail in the Community grid is dark
    with a screenshot in it. This product is about paper, so the sheet is the artwork,
    and it stands out precisely by not competing on that axis.

    Didot for the wordmark. The Didots were a Paris printing dynasty and the typeface
    is theirs, so a prepress tool set in it is using its own subject's letterform
    rather than a generic high contrast serif.
  -->
  <defs>
    <style>
      .display { font-family: Didot, "Didot LT STD", "Bodoni 72", Times, serif; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>

    <!-- Paper tooth. Barely visible, but a flat fill reads as screen rather than stock. -->
    <filter id="tooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#EFEAE0" />
  <rect width="1920" height="1080" filter="url(#tooth)" opacity="0.035" />

  <!-- Trim marks. Lines only, exactly where a printer would set them. -->
  <g stroke="#17140F" stroke-width="1.6" opacity="0.5" fill="none">
    <path d="M40 92V40h52M1828 40h52v52M1880 988v52h-52M92 1040H40v-52" />
  </g>

  <!-- ============ identity ============ -->
  <g transform="translate(132, 300)">
    <text class="display" x="0" y="0" font-size="248" fill="#17140F" letter-spacing="-2">Quire</text>

    <path d="M6 108h560" stroke="#17140F" stroke-width="2.5" />

    <text class="sans" x="6" y="196" font-size="52" font-weight="300" fill="#17140F">Sections to PDF.</text>
    <text class="sans" x="6" y="264" font-size="52" font-weight="300" fill="#17140F">Ordered, merged, compressed.</text>

    <text class="mono" x="6" y="376" font-size="27" fill="#17140F" opacity="0.62" letter-spacing="1">
      Drag to reorder. Split anywhere.
    </text>
    <text class="mono" x="6" y="422" font-size="27" fill="#17140F" opacity="0.62" letter-spacing="1">
      Set a size limit and actually hit it.
    </text>
  </g>

  <!-- ============ the imposition ============
       Sheets gathered in order and bound at the spine, severed where the document
       splits into separate files. This is the product in one picture. -->
  <g transform="translate(1100, 214)">
    <path d="M0 8v150" stroke="#C4342A" stroke-width="6" stroke-linecap="round" />
    <rect x="34" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
    <text class="mono" x="90" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">01</text>
    <rect x="170" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
    <text class="mono" x="226" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">02</text>

    <g transform="translate(0, 190)">
      <path d="M34 0h430" stroke="#17140F" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 9" />
      <text class="mono" x="480" y="8" font-size="21" fill="#17140F" opacity="0.45" letter-spacing="2">CUT</text>
    </g>

    <g transform="translate(0, 222)">
      <path d="M0 8v150" stroke="#C4342A" stroke-width="6" stroke-linecap="round" />
      <rect x="34" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
      <text class="mono" x="90" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">03</text>
      <rect x="170" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
      <text class="mono" x="226" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">04</text>
      <rect x="306" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
      <text class="mono" x="362" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">05</text>
    </g>

    <g transform="translate(0, 412)">
      <path d="M34 0h430" stroke="#17140F" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="7 9" />
      <text class="mono" x="480" y="8" font-size="21" fill="#17140F" opacity="0.45" letter-spacing="2">CUT</text>
    </g>

    <g transform="translate(0, 444)">
      <path d="M0 8v150" stroke="#C4342A" stroke-width="6" stroke-linecap="round" />
      <rect x="34" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
      <text class="mono" x="90" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">06</text>
      <rect x="170" y="4" width="112" height="150" rx="3" fill="#FFFFFF" stroke="#17140F" stroke-opacity="0.28" />
      <text class="mono" x="226" y="90" font-size="34" fill="#17140F" opacity="0.7" text-anchor="middle">07</text>
    </g>

    <text class="mono" x="34" y="672" font-size="25" fill="#17140F" opacity="0.55" letter-spacing="1.5">
      3 PDFs, 4.2 MB, under 10 MB
    </text>
  </g>

  <!-- ============ colour bar ============
       The one saturated moment on the sheet, and the only place process ink appears.
       Real proof sheets carry this strip along the trim edge for density checking. -->
  <g transform="translate(132, 934)">
    <rect x="0" y="0" width="76" height="46" fill="#0F7A9E" />
    <rect x="76" y="0" width="76" height="46" fill="#B8256F" />
    <rect x="152" y="0" width="76" height="46" fill="#E5B93C" />
    <rect x="228" y="0" width="76" height="46" fill="#17140F" />
    <rect x="304" y="0" width="76" height="46" fill="#C4342A" />
    <rect x="380" y="0" width="76" height="46" fill="#17140F" opacity="0.72" />
    <rect x="456" y="0" width="76" height="46" fill="#17140F" opacity="0.46" />
    <rect x="532" y="0" width="76" height="46" fill="#17140F" opacity="0.22" />
    <rect x="608" y="0" width="76" height="46" fill="#17140F" opacity="0.09" />

    <text class="mono" x="712" y="32" font-size="21" fill="#17140F" opacity="0.45" letter-spacing="2.5">
      QUIRE / FIGMA TO PDF / NOTHING LEAVES YOUR MACHINE
    </text>
  </g>
</svg>
